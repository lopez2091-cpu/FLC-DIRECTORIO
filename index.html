<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painevapos - Productos Premium de Vaper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Poppins', sans-serif; background: #0a0e27; color: #e8e8e8; -webkit-font-smoothing: antialiased; }

    :root {
      --primary: #00d4ff;
      --primary-dark: #0099cc;
      --accent: #ff006e;
      --accent-light: #ff4d8f;
      --bg-dark: #0a0e27;
      --bg-darker: #050812;
      --surface: #1a1f3a;
      --surface-light: #2d3454;
      --text: #e8e8e8;
      --text-muted: #a0a0b0;
      --border: #2d3454;
      --success: #00ff88;
    }

    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    svg { display: block; flex: none; }

    /* ── Header/Nav ── */
    header {
      background: linear-gradient(135deg, var(--bg-dark) 0%, var(--surface) 100%);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      align-items: center;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      transition: color 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .nav-links .cart {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }

    .nav-links .cart:hover {
      border-color: var(--primary);
      background: rgba(0, 212, 255, 0.1);
    }

    .nav-links .cart-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }

    /* ── Hero ── */
    .hero {
      max-width: 1400px;
      margin: 0 auto;
      padding: 6rem 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
      min-height: 600px;
    }

    .hero-content h1 {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      color: var(--text);
    }

    .hero-content h1 .accent {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-content p {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .hero-buttons {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #000;
      box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0, 212, 255, 0.4);
    }

    .btn-secondary {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .btn-secondary:hover {
      background: rgba(0, 212, 255, 0.1);
      transform: translateY(-2px);
    }

    .hero-visual {
      position: relative;
      height: 450px;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(255, 0, 110, 0.1) 100%);
      border-radius: 20px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero-visual::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.3) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    .hero-visual::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255, 0, 110, 0.2) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite reverse;
      left: 50px;
    }

    .hero-visual-content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .hero-visual-content svg {
      width: 200px;
      height: 200px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    /* ── Products Section ── */
    .section {
      max-width: 1400px;
      margin: 0 auto;
      padding: 6rem 2rem;
    }

    .section-title {
      text-align: center;
      margin-bottom: 4rem;
    }

    .section-title h2 {
      font-size: 2.8rem;
      font-weight: 800;
      margin-bottom: 1rem;
      color: var(--text);
    }

    .section-title h2 .accent {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .section-title p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 500px;
      margin: 0 auto;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      border-color: var(--primary);
      box-shadow: 0 12px 32px rgba(0, 212, 255, 0.15);
      transform: translateY(-8px);
    }

    .product-image {
      width: 100%;
      height: 220px;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.05) 0%, rgba(255, 0, 110, 0.05) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      border-bottom: 1px solid var(--border);
    }

    .product-info {
      padding: 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .product-category {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--primary);
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .product-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .product-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 1rem;
      flex: 1;
    }

    .product-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-price {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .product-btn {
      padding: 8px 16px;
      background: var(--primary);
      color: #000;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      transition: all 0.3s;
    }

    .product-btn:hover {
      background: var(--primary-dark);
      transform: scale(1.05);
    }

    /* ── Features ── */
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      margin-top: 4rem;
    }

    .feature-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      transition: all 0.3s;
    }

    .feature-item:hover {
      border-color: var(--primary);
      background: rgba(0, 212, 255, 0.05);
    }

    .feature-icon {
      font-size: 48px;
      margin-bottom: 1rem;
    }

    .feature-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 0.8rem;
      color: var(--text);
    }

    .feature-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* ── Contact ── */
    .contact-section {
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(255, 0, 110, 0.1) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 4rem 2rem;
      text-align: center;
    }

    .contact-section h3 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      color: var(--text);
    }

    .contact-section p {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .contact-buttons {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ── Footer ── */
    footer {
      background: var(--bg-darker);
      border-top: 1px solid var(--border);
      padding: 3rem 2rem;
      margin-top: 6rem;
    }

    .footer-content {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .footer-col h4 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--text);
    }

    .footer-col a {
      display: block;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
      transition: color 0.3s;
    }

    .footer-col a:hover {
      color: var(--primary);
    }

    .footer-bottom {
      border-top: 1px solid var(--border);
      padding-top: 2rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .hero {
        grid-template-columns: 1fr;
        padding: 3rem 1.5rem;
        min-height: auto;
      }

      .hero-content h1 {
        font-size: 2.5rem;
      }

      .hero-visual {
        height: 300px;
      }

      .nav-links {
        gap: 1.5rem;
      }

      .nav-links a {
        font-size: 12px;
      }

      .section-title h2 {
        font-size: 2rem;
      }

      .contact-buttons {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <script>
  const { useState, createElement: h, Fragment } = React;

  const PRODUCTS = [
    { id: 1, name: 'Vape Pod Pro', category: 'Dispositivos', desc: 'Dispositivo de última generación con batería de larga duración', price: '$45.990', emoji: '💨' },
    { id: 2, name: 'Cartuchos Premium', category: 'Cartuchos', desc: 'Sabores intensos y auténticos para disfrutar', price: '$8.990', emoji: '🌪️' },
    { id: 3, name: 'E-Liquids Artesanales', category: 'Líquidos', desc: 'Mezcla perfecta de sabor y calidad', price: '$12.990', emoji: '💧' },
    { id: 4, name: 'Kit Iniciador', category: 'Kits', desc: 'Todo lo que necesitas para empezar', price: '$59.990', emoji: '🎁' },
    { id: 5, name: 'Baterías Extra', category: 'Accesorios', desc: 'Recarga rápida, rendimiento garantizado', price: '$15.990', emoji: '🔋' },
    { id: 6, name: 'Bolsa de Viaje', category: 'Accesorios', desc: 'Protege tus dispositivos en cualquier lugar', price: '$9.990', emoji: '👜' },
  ];

  function Icon({ name }) {
    const icons = {
      cart: h('svg', {viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2}, h('circle',{cx:9,cy:21,r:1}), h('circle',{cx:20,cy:21,r:1}), h('path',{d:'M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6'})),
      phone: h('svg', {viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2}, h('path',{d:'M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z'})),
      whatsapp: h('svg', {viewBox:'0 0 24 24',fill:'currentColor'}, h('path',{d:'M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.67-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.076 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421-7.403h-.006a9.87 9.87 0 00-5.031 1.378c-3.055 2.267-3.555 6.645-1.288 9.7 2.267 3.055 6.645 3.555 9.7 1.288 3.055-2.267 3.555-6.645 1.288-9.7-1.149-1.549-2.848-2.486-4.663-2.666zm0-2.109c5.92 0 10.71 4.79 10.71 10.71s-4.79 10.71-10.71 10.71S.57 21.92.57 16s4.79-10.71 10.71-10.71z'})),
      mail: h('svg', {viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2}, h('rect',{x:2,y:4,width:20,height:16,rx:2}), h('path',{d:'m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7'})),
      arrow: h('svg', {viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2}, h('path',{d:'M5 12h14M13 6l6 6-6 6'})),
    };
    return icons[name] || null;
  }

  function Header() {
    const [cartCount] = useState(0);
    return h('header', null,
      h('div', { className: 'nav-container' },
        h('div', { className: 'logo' }, 'Painevapos'),
        h('nav', { className: 'nav-links' },
          h('a', { href: '#productos' }, 'Productos'),
          h('a', { href: '#sobre' }, 'Sobre Nosotros'),
          h('a', { href: '#contacto' }, 'Contacto'),
          h('button', { className: 'cart' },
            Icon({ name: 'cart' }),
            cartCount > 0 && h('span', { className: 'cart-badge' }, cartCount)
          )
        )
      )
    );
  }

  function Hero() {
    return h('section', { className: 'hero' },
      h('div', { className: 'hero-content' },
        h('h1', null,
          'Experiencia ',
          h('span', { className: 'accent' }, 'Premium'),
          ' de Vaper'
        ),
        h('p', null, 'Descubre nuestra colección exclusiva de dispositivos y líquidos de la más alta calidad. Diseñados para los amantes del vaping que buscan perfección.'),
        h('div', { className: 'hero-buttons' },
          h('button', { className: 'btn btn-primary' }, 'Explorar Catálogo'),
          h('button', { className: 'btn btn-secondary' }, Icon({ name: 'arrow' }), 'Ver Más')
        )
      ),
      h('div', { className: 'hero-visual' },
        h('div', { className: 'hero-visual-content' }, '💨')
      )
    );
  }

  function ProductCard({ product }) {
    return h('div', { className: 'product-card' },
      h('div', { className: 'product-image' }, product.emoji),
      h('div', { className: 'product-info' },
        h('div', { className: 'product-category' }, product.category),
        h('h3', { className: 'product-name' }, product.name),
        h('p', { className: 'product-desc' }, product.desc),
        h('div', { className: 'product-footer' },
          h('span', { className: 'product-price' }, product.price),
          h('button', { className: 'product-btn' }, 'Agregar')
        )
      )
    );
  }

  function Products() {
    return h('section', { className: 'section', id: 'productos' },
      h('div', { className: 'section-title' },
        h('h2', null, 'Nuestros ', h('span', { className: 'accent' }, 'Productos')),
        h('p', null, 'Selecciona los mejores productos de vaper con garantía y soporte garantizado')
      ),
      h('div', { className: 'products-grid' },
        PRODUCTS.map(p => h(ProductCard, { key: p.id, product: p }))
      )
    );
  }

  function Features() {
    return h('section', { className: 'section' },
      h('div', { className: 'section-title' },
        h('h2', null, 'Por qué ', h('span', { className: 'accent' }, 'Painevapos')),
        h('p', null, 'Somos los líderes en calidad y servicio')
      ),
      h('div', { className: 'features' },
        h('div', { className: 'feature-item' },
          h('div', { className: 'feature-icon' }, '✅'),
          h('h4', { className: 'feature-title' }, 'Productos Auténticos'),
          h('p', { className: 'feature-desc' }, 'Garantizamos 100% de autenticidad en todos nuestros productos')
        ),
        h('div', { className: 'feature-item' },
          h('div', { className: 'feature-icon' }, '🚚'),
          h('h4', { className: 'feature-title' }, 'Envío Rápido'),
          h('p', { className: 'feature-desc' }, 'Entrega en 24-48 horas a todo el país')
        ),
        h('div', { className: 'feature-item' },
          h('div', { className: 'feature-icon' }, '💬'),
          h('h4', { className: 'feature-title' }, 'Soporte Premium'),
          h('p', { className: 'feature-desc' }, 'Atención al cliente disponible 7 días a la semana')
        ),
        h('div', { className: 'feature-item' },
          h('div', { className: 'feature-icon' }, '🔒'),
          h('h4', { className: 'feature-title' }, 'Compra Segura'),
          h('p', { className: 'feature-desc' }, 'Transacciones cifradas y datos protegidos')
        )
      )
    );
  }

  function Contact() {
    return h('section', { className: 'section', id: 'contacto' },
      h('div', { className: 'contact-section' },
        h('h3', null, '¿Listo para comenzar?'),
        h('p', null, 'Contáctanos hoy mismo y descubre por qué somos la mejor opción para tus necesidades de vaper'),
        h('div', { className: 'contact-buttons' },
          h('a', { className: 'btn btn-primary', href: 'https://wa.me/56912345678', target: '_blank', rel: 'noreferrer' }, Icon({ name: 'whatsapp' }), 'WhatsApp'),
          h('a', { className: 'btn btn-secondary', href: 'tel:+56912345678' }, Icon({ name: 'phone' }), 'Llamar'),
          h('a', { className: 'btn btn-secondary', href: 'mailto:info@painevapos.cl' }, Icon({ name: 'mail' }), 'Email')
        )
      )
    );
  }

  function Footer() {
    return h('footer', null,
      h('div', { className: 'footer-content' },
        h('div', { className: 'footer-col' },
          h('h4', null, 'Painevapos'),
          h('a', { href: '#' }, 'Sobre Nosotros'),
          h('a', { href: '#' }, 'Ubicación'),
          h('a', { href: '#' }, 'Política de Privacidad')
        ),
        h('div', { className: 'footer-col' },
          h('h4', null, 'Productos'),
          h('a', { href: '#' }, 'Dispositivos'),
          h('a', { href: '#' }, 'Líquidos'),
          h('a', { href: '#' }, 'Accesorios')
        ),
        h('div', { className: 'footer-col' },
          h('h4', null, 'Soporte'),
          h('a', { href: '#' }, 'Centro de Ayuda'),
          h('a', { href: '#' }, 'Envíos'),
          h('a', { href: '#' }, 'Devoluciones')
        ),
        h('div', { className: 'footer-col' },
          h('h4', null, 'Síguenos'),
          h('a', { href: '#' }, 'Instagram'),
          h('a', { href: '#' }, 'Facebook'),
          h('a', { href: '#' }, 'TikTok')
        )
