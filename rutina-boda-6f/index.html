<style>
/* Layout: sala de pesas. Fondo de goma negra, tiza blanca, y cada día lleva el color de un disco olímpico (rojo 25, azul 20, amarillo 15, verde 10, blanco 5). Una columna para el celular. */
:root{
  --floor:#141517;      /* piso de goma */
  --rack:#1E2023;       /* superficie de tarjeta */
  --steel:#2B2E33;      /* bordes, separadores */
  --chalk:#EEECE6;      /* texto principal */
  --dust:#9EA2A8;       /* texto secundario */
  --plate:#E5483B;      /* acento del día (cambia por JS) */
  --plate-ink:#141517;  /* texto sobre el acento */
  --warn:#F2B630;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--floor);color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:env(safe-area-inset-top,0px) calc(48px + env(safe-area-inset-bottom,0px))}

/* Cabecera */
.top{padding-block:20px 6px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.brand{font-family:var(--f-display);font-weight:900;font-size:34px;line-height:.9;letter-spacing:.01em;text-transform:uppercase;margin:0}
.brand small{display:block;font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.14em;color:var(--dust);margin-top:6px}
.count{text-align:right;flex-shrink:0}
.count b{display:block;font-family:var(--f-display);font-weight:900;font-size:40px;line-height:.9;color:var(--plate);font-variant-numeric:tabular-nums}
.count span{font-family:var(--f-label);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dust)}
.phase{margin-block:12px 0;font-family:var(--f-label);font-size:14px;letter-spacing:.06em;color:var(--dust);border-top:1px solid var(--steel);padding-top:10px}
.phase strong{color:var(--chalk)}

/* Tabs de días: discos */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--floor);display:flex;gap:6px;overflow-x:auto;padding-block:12px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none;border-bottom:1px solid var(--steel)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--dust);cursor:pointer;padding:0 2px;font-family:var(--f-label);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.disc{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--ink);font-family:var(--f-display);font-weight:900;font-size:17px;box-shadow:inset 0 0 0 4px rgba(0,0,0,.22),inset 0 0 0 15px var(--c),inset 0 0 0 17px rgba(0,0,0,.25);opacity:.45;transition:opacity .15s,transform .15s}
.tab[aria-selected="true"]{color:var(--chalk)}
.tab[aria-selected="true"] .disc{opacity:1;transform:scale(1.08)}
.tab:focus-visible{outline:2px solid var(--chalk);outline-offset:3px;border-radius:6px}

/* Encabezado del día */
.dayhead{padding-block:22px 6px}
.eyebrow{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--plate)}
.dayhead h2{font-family:var(--f-display);font-weight:900;font-size:44px;line-height:.92;text-transform:uppercase;margin:4px 0 10px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.04em;padding:4px 10px;border-radius:999px;border:1px solid var(--steel);color:var(--chalk);background:var(--rack)}
.note{margin-top:12px;font-size:14px;color:var(--dust)}
.note b{color:var(--chalk)}

/* Bloques */
.block-title{display:flex;align-items:center;gap:10px;margin:26px 0 10px;font-family:var(--f-label);font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--dust)}
.block-title::after{content:"";flex:1;height:1px;background:var(--steel)}
.warm{display:grid;gap:8px}
.warm li{list-style:none;display:flex;gap:10px;align-items:baseline}
.warm{padding:0;margin:0}
.warm li::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--plate);flex-shrink:0;transform:translateY(-1px)}

/* Tarjeta de ejercicio */
.ex{background:var(--rack);border-radius:14px;overflow:hidden;margin-bottom:14px;border:1px solid var(--steel)}
.ex-top{display:grid;grid-template-columns:1fr;gap:0}
.pics{display:grid;grid-template-columns:repeat(var(--n,1),1fr);gap:2px;background:var(--steel)}
.pic{position:relative;aspect-ratio:4/3;max-width:100%;background:radial-gradient(120% 90% at 50% 0%,#2a2d32 0%,#17181b 70%);display:grid;place-items:center;text-decoration:none;color:var(--chalk);overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .ph{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:10px}
.pic .ph svg{width:34px;height:34px;color:var(--plate)}
.pic .ph span{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.pic .ph em{font-style:normal;font-size:12px;color:var(--dust)}
.pic:focus-visible{outline:2px solid var(--plate);outline-offset:-2px}
.ex-body{padding:14px 14px 12px;display:grid;gap:10px}
.ex-head{display:flex;gap:12px;align-items:flex-start}
.num{flex-shrink:0;width:34px;height:34px;border-radius:8px;background:var(--plate);color:var(--plate-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:20px}
.ex-name{min-width:0}
.ex-name h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase;text-wrap:balance}
.ex-name p{margin:4px 0 0;font-size:13px;color:var(--dust)}
.dose{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--steel);border-radius:10px;overflow:hidden}
.dose div{background:var(--floor);padding:8px 6px;text-align:center}
.dose b{display:block;font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.dose span{font-family:var(--f-label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dust)}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:8px;align-items:baseline;font-size:14px}
.opt i{font-style:normal;flex-shrink:0;font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.06em;padding:1px 7px;border-radius:5px;border:1px solid var(--steel);color:var(--dust)}
.opt.a i{background:var(--plate);border-color:var(--plate);color:var(--plate-ink)}
.cues{margin:0;padding:0;display:grid;gap:4px}
.cues li{list-style:none;font-size:14px;color:var(--chalk);padding-left:16px;position:relative}
.cues li::before{content:"›";position:absolute;left:2px;color:var(--plate);font-weight:700}
.alert{display:flex;gap:8px;font-size:13px;line-height:1.4;background:rgba(242,182,48,.1);border:1px solid rgba(242,182,48,.35);color:var(--chalk);padding:8px 10px;border-radius:8px}
.alert b{color:var(--warn)}

/* Registro de series */
.log{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:10px;border-top:1px dashed var(--steel)}
.log label.kg{display:flex;align-items:center;gap:6px;font-family:var(--f-label);font-size:13px;letter-spacing:.06em;color:var(--dust);text-transform:uppercase}
.log input[type=number]{width:70px;background:var(--floor);border:1px solid var(--steel);color:var(--chalk);border-radius:8px;padding:6px 8px;font:600 16px var(--f-body);font-variant-numeric:tabular-nums}
.log input[type=number]:focus{outline:2px solid var(--plate);outline-offset:1px}
.sets{display:flex;gap:6px;margin-left:auto}
.set{position:relative}
.set input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.set span{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2px solid var(--steel);font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--dust)}
.set input:checked + span{background:var(--plate);border-color:var(--plate);color:var(--plate-ink)}
.set input:focus-visible + span{outline:2px solid var(--chalk);outline-offset:2px}

/* Cardio */
.cardio{border-color:var(--plate)}
.zone{display:flex;align-items:center;gap:10px;font-size:14px}
.zone .bar{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#3FA35B 0 40%,#F2B630 40% 70%,#E5483B 70%);position:relative}
.zone .bar::after{content:"";position:absolute;top:-4px;bottom:-4px;left:var(--l);width:var(--w);border:2px solid var(--chalk);border-radius:5px}

/* Claves */
.keys{display:grid;gap:12px}
.key{background:var(--rack);border:1px solid var(--steel);border-radius:14px;padding:14px}
.key h3{margin:0 0 8px;font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase}
.key p,.key li{font-size:14px;margin:0}
.key ul{margin:0;padding-left:18px;display:grid;gap:4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:7px 4px;border-top:1px solid var(--steel);vertical-align:top}
.tbl td:first-child{font-family:var(--f-label);font-weight:700;letter-spacing:.04em;white-space:nowrap;color:var(--dust);padding-right:10px}
.tbl tr.now td{color:var(--chalk)}
.tbl tr.now td:first-child{color:var(--plate)}
.foot{margin-top:28px;font-size:12px;color:var(--dust);text-align:center}
button.reset{background:none;border:1px solid var(--steel);color:var(--dust);border-radius:8px;padding:6px 12px;font:600 13px var(--f-label);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* Fases y fechas */
const START = new Date(2026,9,12); // lunes 12 oct 2026
const WEDDING = new Date(2027,1,6);
const PHASES = [
  {from:new Date(2026,9,12), to:new Date(2026,10,8),  name:"Fase 1 · Adaptación", rir:"RIR 3", txt:"Cargas moderadas, técnica perfecta."},
  {from:new Date(2026,10,9), to:new Date(2026,11,20), name:"Fase 2 · Progresión", rir:"RIR 1–2", txt:"Sube 1 rep o un poco de peso cada semana. Suma intervalos."},
  {from:new Date(2026,11,21),to:new Date(2027,0,3),   name:"Fase 3 · Fiestas", rir:"RIR 1–2", txt:"Mismo entrenamiento, calorías en mantención."},
  {from:new Date(2027,0,4),  to:new Date(2027,0,30),  name:"Fase 4 · Empuje final", rir:"RIR 1–2", txt:"Déficit completo, más pasos, cero alcohol."},
  {from:new Date(2027,0,31), to:new Date(2027,1,6),   name:"Fase 5 · Afinamiento", rir:"RIR 3", txt:"Volumen −40%. Llegar descansado."},
];
const today = new Date(); today.setHours(0,0,0,0);
const daysLeft = Math.max(0, Math.round((WEDDING - today)/864e5));
document.getElementById("days").textContent = daysLeft;
const cur = PHASES.find(p => today >= p.from && today <= p.to) || (today < START ? PHASES[0] : PHASES[4]);
const week = Math.max(1, Math.floor((today - START)/ (7*864e5)) + 1);
document.getElementById("phase").innerHTML = today < START
  ? `<strong>Parte el lunes 12 oct</strong> · ${PHASES[0].name} · ${PHASES[0].rir}: ${PHASES[0].txt}`
  : `<strong>Semana ${Math.min(week,17)}</strong> · ${cur.name} · ${cur.rir}: ${cur.txt}`;

/* Almacenamiento local (opcional) */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem("boda6f:"+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem("boda6f:"+k, JSON.stringify(v)); }catch(e){} }
};

function pic(id, label){
  return `<a class="pic" href="${IMG_BASE}${IMG[id]}.png" target="_blank" rel="noopener" aria-label="Ver imagen grande: ${label}">
    <img src="${IMG_BASE}${IMG[id]}_min.webp" alt="${label}" loading="lazy" width="640" height="480"
      onerror="this.onerror=null;this.src='${IMG_BASE}${IMG[id]}.png'"></a>`;
}
function pics(ids, labels){
  return `<div class="pics" style="--n:${ids.length}">${ids.map((id,i)=>pic(id, labels?labels[i]:id)).join("")}</div>`;
}
const LABELS = {plancha:"Plancha", dead_bug:"Dead bug", curl_biceps:"Curl bíceps", triceps:"Tríceps polea", curl_maq:"Curl máquina",
  trineo:"Trineo", farmer:"Farmer walk", remo_ergo:"Remo ergómetro", kb_swing:"Kettlebell swing", puente_iso:"Puente isométrico"};

function exCard(d, e, i){
  const id = `${d.key}-${i}`;
  const n = typeof e.sets === "number" ? e.sets : 4;
  const done = store.get("done:"+id+":"+today.toDateString()) || [];
  const kg = store.get("kg:"+id) ?? "";
  const labels = e.img.length > 1 ? e.img.map(x=>LABELS[x]||x) : [e.n];
  return `<article class="ex">
    ${pics(e.img, labels)}
    <div class="ex-body">
      <div class="ex-head"><div class="num">${i+1}</div>
        <div class="ex-name"><h3>${e.n}</h3><p>${e.sub}</p></div></div>
      <div class="dose"><div><b>${e.sets}</b><span>series</span></div><div><b>${e.reps}</b><span>reps</span></div><div><b>${e.rest}</b><span>descanso</span></div></div>
      <div class="opts"><div class="opt a"><i>A</i><span>${e.a}</span></div><div class="opt"><i>B</i><span>${e.b}</span></div></div>
      <ul class="cues">${e.cues.map(c=>`<li>${c}</li>`).join("")}</ul>
      ${e.alert?`<div class="alert">⚠️<span>${e.alert}</span></div>`:""}
      <div class="log">
        <label class="kg" for="kg-${id}">Peso <input type="number" inputmode="decimal" id="kg-${id}" data-id="${id}" value="${kg}" placeholder="kg"></label>
        <div class="sets" role="group" aria-label="Series hechas">
          ${Array.from({length:n},(_,s)=>`<label class="set"><input type="checkbox" id="s-${id}-${s}" data-id="${id}" data-s="${s}" ${done.includes(s)?"checked":""} aria-label="Serie ${s+1}"><span>${s+1}</span></label>`).join("")}
        </div>
      </div>
    </div></article>`;
}

function cardioCard(c){
  return `<article class="ex cardio">
    ${pics([c.img],[c.n])}
    <div class="ex-body">
      <div class="ex-head"><div class="num">♥</div><div class="ex-name"><h3>${c.n}</h3><p>${c.detail}</p></div></div>
      <div class="dose"><div><b>${c.time}</b><span>tiempo</span></div><div style="grid-column:span 2"><b style="font-size:20px">${c.zone}</b><span>pulsaciones</span></div></div>
      <div class="zone"><span style="font-size:12px;color:var(--dust)">Suave</span><div class="bar" style="--l:${c.l};--w:${c.w}"></div><span style="font-size:12px;color:var(--dust)">Máx</span></div>
    </div></article>`;
}

function runBlock(){
  return `<div class="block-title">Caminar-trotar con tu pareja</div>
  <div class="key"><table class="tbl">
    <tr class="${week<=4?'now':''}"><td>Sem 1–4</td><td>Sin trote: caminadora inclinada, elíptica o bici. Construyes base sin impacto.</td></tr>
    <tr class="${week>=5&&week<=10?'now':''}"><td>Sem 5–10</td><td>1 min trotando / 2 min caminando × 8–10</td></tr>
    <tr class="${week>=11?'now':''}"><td>Sem 11+</td><td>3 min trotando / 1 min caminando</td></tr>
    <tr><td>Siempre</td><td>Sin sprints por ahora. Calienta antes con balanceos de pierna.</td></tr>
  </table></div>`;
}

function keysView(){
  return `<section class="dayhead"><div class="eyebrow">Para tener a mano</div><h2>Claves del plan</h2></section>
  <div class="keys">
    <div class="key"><h3>Fases</h3><table class="tbl">${PHASES.map(p=>`<tr class="${p===cur&&today>=START?'now':''}"><td>${p.from.toLocaleDateString('es-CL',{day:'numeric',month:'short'})} – ${p.to.toLocaleDateString('es-CL',{day:'numeric',month:'short'})}</td><td><b>${p.name}</b><br>${p.rir} · ${p.txt}</td></tr>`).join("")}</table></div>
    <div class="key"><h3>Cómo subir peso</h3><ul>
      <li>Parte con un peso que te deje 12 reps con unas 3 más en reserva.</li>
      <li>Cada sesión intenta sumar 1 repetición.</li>
      <li>Cuando completes todas las series en el máximo del rango, sube 2,5–5 kg y vuelve a 8–10 reps.</li></ul></div>
    <div class="key"><h3>RIR</h3><p>Repeticiones que te quedan en reserva al terminar la serie. RIR 3 = podías hacer 3 más.</p></div>
    <div class="key"><h3>Regla del dolor</h3><ul>
      <li>Hasta <b>3/10</b> de molestia y sin empeorar al día siguiente: sigue.</li>
      <li>Si tira o pasa de <b>4/10</b>: para ese ejercicio hoy y usa la opción B.</li>
      <li>Si una molestia se repite por 3–4 semanas: kinesiólogo deportivo.</li></ul></div>
    <div class="key"><h3>Zonas cardíacas</h3><table class="tbl">
      <tr><td>Zona 2</td><td>115–135 ppm · cardio después de pesas</td></tr>
      <tr><td>Intervalos</td><td>155–165 ppm en el tramo fuerte</td></tr>
      <tr><td>Máximo</td><td>~185 ppm · no necesitas llegar ahí</td></tr></table></div>
    <div class="key"><h3>Antes y después</h3><ul>
      <li><b>No entrenes en ayunas:</b> yogur proteico, o plátano + café con leche.</li>
      <li>Post-gym: desayuno con proteína y los carbohidratos del día.</li>
      <li>Meta diaria: 8–10 mil pasos y 3 L de agua.</li></ul></div>
  </div>
  <button class="reset" id="reset" type="button">Borrar series marcadas de hoy</button>`;
}

function render(key){
  const d = DAYS.find(x=>x.key===key) || DAYS[0];
  document.documentElement.style.setProperty("--plate", d.color);
  document.documentElement.style.setProperty("--plate-ink", d.ink);
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.key===d.key));
  const v = document.getElementById("view");
  if (d.keys){ v.innerHTML = keysView(); bindReset(); store.set("tab", d.key); return; }
  v.innerHTML = `
    <section class="dayhead">
      <div class="eyebrow">${d.when}</div>
      <h2>${d.label}</h2>
      <div class="meta"><span class="chip">${d.focus}</span><span class="chip">${d.dur}</span>${d.ex.length?`<span class="chip">${cur.rir}</span>`:""}</div>
      <p class="note">${d.note}</p>
    </section>
    <div class="block-title">${d.ex.length?"Calentamiento":"Plan"}</div>
    <ul class="warm">${d.warm.map(w=>`<li>${w}</li>`).join("")}</ul>
    ${d.warmImg?`<div style="margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid var(--steel)">${pics(d.warmImg,["Puente isométrico de femoral"])}</div>`:""}
    ${d.ex.length?`<div class="block-title">Fuerza</div>`:""}
    ${d.ex.map((e,i)=>exCard(d,e,i)).join("")}
    ${d.extraImg?`<div style="border-radius:12px;overflow:hidden;border:1px solid var(--steel);margin-bottom:14px">${pics(d.extraImg,["Kettlebell swing (fase 2)"])}</div>`:""}
    <div class="block-title">Cardio</div>
    ${cardioCard(d.cardio)}
    ${d.run?runBlock():""}`;
  bindLog();
  store.set("tab", d.key);
}

function bindLog(){
  document.querySelectorAll('.log input[type=number]').forEach(inp=>{
    inp.addEventListener("change",()=>store.set("kg:"+inp.dataset.id, inp.value));
  });
  document.querySelectorAll('.set input').forEach(cb=>{
    cb.addEventListener("change",()=>{
      const k = "done:"+cb.dataset.id+":"+today.toDateString();
      const arr = new Set(store.get(k)||[]); const s = +cb.dataset.s;
      cb.checked ? arr.add(s) : arr.delete(s); store.set(k,[...arr]);
    });
  });
}
function bindReset(){
  const b = document.getElementById("reset"); if(!b) return;
  b.addEventListener("click",()=>{
    try{ Object.keys(localStorage).filter(k=>k.startsWith("boda6f:done:")&&k.endsWith(today.toDateString())).forEach(k=>localStorage.removeItem(k)); }catch(e){}
    b.textContent = "Series de hoy borradas";
  });
}

/* Tabs */
const tabs = document.getElementById("tabs");
tabs.innerHTML = DAYS.map(d=>`<button class="tab" role="tab" type="button" data-key="${d.key}" id="tab-${d.key}" style="--c:${d.color};--ink:${d.ink}"><span class="disc">${d.kg}</span>${d.short}</button>`).join("");
tabs.addEventListener("click",e=>{ const t=e.target.closest(".tab"); if(t){ render(t.dataset.key); window.scrollTo({top:0}); } });

const hash = (location.hash||"").slice(1);
const byWeekday = ["fds","lun","mar","mie","jue","vie","fds"][new Date().getDay()];
render(DAYS.some(d=>d.key===hash) ? hash : byWeekday);
</script>
